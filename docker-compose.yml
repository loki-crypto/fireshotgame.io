# Pilha completa: Postgres + API + SPA atrás do nginx.
#   cp .env.example .env && openssl genpkey -algorithm ed25519 -out infra/cert-key.pem
#   docker compose up --build   → http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fireshot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fireshot}
      POSTGRES_DB: ${POSTGRES_DB:-fireshot}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fireshot} -d ${POSTGRES_DB:-fireshot}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://fireshot:fireshot@db:5432/fireshot}
      CERT_PRIVATE_KEY_FILE: /run/secrets/cert-key.pem
      CONTENT_DIR: /srv/packages/content
    volumes:
      - ./infra/cert-key.pem:/run/secrets/cert-key.pem:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  db-data:
