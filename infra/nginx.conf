# nginx do compose: serve a SPA, a página pública de verificação e faz proxy da API.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # assets com hash no nome: cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /verificar.html {
        add_header Cache-Control "no-cache";
    }

    # /verificar/{codigo} é uma segunda página (não faz parte da SPA)
    location /verificar {
        add_header Cache-Control "no-cache";
        try_files $uri /verificar.html;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /.well-known/certificate-public-key {
        proxy_pass http://api:8000/.well-known/certificate-public-key;
        proxy_set_header Host $host;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
