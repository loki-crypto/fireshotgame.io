[project]
name = "fireshot-api"
version = "0.1.0"
description = "API do Fireshot: Defesa de Rede (auth, progresso, terminais, tempo ativo, certificados)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "argon2-cffi>=23.1",
  "pyjwt>=2.10",
  "cryptography>=44",
  "weasyprint>=63",
  "qrcode>=8.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "httpx>=0.28",
  "ruff>=0.8",
  "pypdf>=5.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:weasyprint.*", "ignore::DeprecationWarning:fontTools.*"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101", "B008", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"app/config.py" = ["S105"]
"alembic/*" = ["E501"]
